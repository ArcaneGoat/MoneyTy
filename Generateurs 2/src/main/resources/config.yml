# Intervalle de production en secondes (redemarrage necessaire pour l'appliquer)
interval-seconds: 15

economy:
  # Valeur d'un item du palier 1 (bloc de foin) et du palier 100 (bloc de commande).
  # Les paliers intermediaires suivent une courbe exponentielle.
  base-value: 1
  top-value: 5000000
  # Prix d'achat = valeur de l'item x ce coefficient (foin : 1$ -> 50$, terre : 2$ -> 100$).
  # L'amelioration coute la difference de prix entre deux paliers (neutre : ni gain ni perte).
  price-multiplier: 50
  # Budget indicatif (50Q). Pas une limite : sert aux alertes console et a /gen eco.
  budget: 5.0E16

limits:
  # Nombre maximum de generateurs par joueur. Surchargeable via la permission gen.max.<n>
  default-max-generators: 25
  # Nombre maximum de beacons poses en meme temps par joueur
  max-beacons: 3

barrel:
  # Capacite en items = capacite par niveau x niveau du barrel (niveau 1 a 20 = multiplicateur x1 a x20)
  capacity-per-level: 10000
  max-level: 20

beacon:
  # Bonus maximum d'un beacon (1.0 = +100%). Les bonus des beacons actifs s'additionnent.
  max-bonus: 1.0
  # Duree de vie par defaut quand elle n'est pas precisee dans /gen givebeacon
  default-duration-hours: 24
