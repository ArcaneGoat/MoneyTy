name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B -f Generateurs/pom.xml clean package
      - uses: actions/upload-artifact@v4
        with:
          name: Generateurs-jar
          path: Generateurs/target/Generateurs-*.jar
