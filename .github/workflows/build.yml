name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Chercher le pom.xml
        run: |
          find . -name pom.xml
          mvn -B -f "$(find . -name pom.xml | head -n 1)" clean package
      - uses: actions/upload-artifact@v4
        with:
          name: Generateurs-jar
          path: '**/target/Generateurs-*.jar'
